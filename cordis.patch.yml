# dsh-android-agent bundle patch: inserts the phone-agent plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# dsh.bundle.patch manifest field) over dsh-base; activate with
#   dsh plugin --profile web add link:D:\code\dsh\dsh-android-agent
- insert:
    - id: phone
      name: 'dsh-android-agent'
